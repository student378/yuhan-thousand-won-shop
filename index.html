<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#2B4D9F">
<title>경기도 대학생 천원매점 신청</title>
<style>
  html,body{height:100%;margin:0;background:#f3f4f6;
    font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
  .sp{width:38px;height:38px;border:4px solid #e5e7eb;border-top-color:#2B4D9F;border-radius:50%;
    animation:s .8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  .t{font-size:13px;color:#374151;font-weight:600}
  .s{font-size:11px;color:#9ca3af}
</style>
</head>
<body>
<div class="wrap">
  <div class="sp"></div>
  <div class="t">천원매점 신청 화면을 불러오는 중...</div>
  <div class="s" id="msg">잠시만 기다려주세요</div>
</div>
<script>
/* ══════════════════════════════════════════════════════════════
   로더 (loader)
   ──────────────────────────────────────────────────────────────
   이 파일은 내용이 거의 바뀌지 않으므로 캐시되어도 문제가 없다.
   실제 신청 화면(app.html)은 매번 새 버전값을 붙여 불러오기 때문에
   카카오톡·네이버 인앱 브라우저가 옛 화면을 띄우는 일이 사라진다.

   ※ 앞으로 신청 화면을 수정할 때는 app.html 만 교체하면 된다.
   ══════════════════════════════════════════════════════════════ */
(function () {
  // 10분 단위 버전값 — 이 안에서는 캐시를 활용해 빠르게 뜨고,
  // 10분이 지나면 자동으로 최신 파일을 다시 받는다.
  function stamp() {
    var d = new Date();
    return d.getFullYear()
      + String(d.getMonth() + 1).padStart(2, '0')
      + String(d.getDate()).padStart(2, '0')
      + String(d.getHours()).padStart(2, '0')
      + String(Math.floor(d.getMinutes() / 10));
  }
  // 기존 쿼리(예: ?utm=...)는 그대로 넘겨준다
  var qs = location.search.replace(/^\?/, '');
  var keep = qs ? qs.split('&').filter(function (p) {
    return p && p.indexOf('v=') !== 0;
  }).join('&') : '';
  var url = 'app.html?v=' + stamp() + (keep ? '&' + keep : '') + location.hash;

  setTimeout(function () {
    var m = document.getElementById('msg');
    if (m) m.textContent = '연결이 느립니다. 조금만 더 기다려주세요';
  }, 4000);

  location.replace(url);
})();
</script>
<noscript>
  <div style="padding:24px;text-align:center;font-size:14px;color:#374151">
    자바스크립트가 꺼져 있습니다.<br>
    <a href="app.html" style="color:#2B4D9F;font-weight:700">여기를 눌러 신청 화면으로 이동</a>하세요.
  </div>
</noscript>
</body>
</html>
